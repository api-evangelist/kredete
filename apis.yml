aid: kredete
name: Kredete
description: 'Kredete is an intelligent global finance app for diaspora and emerging-market
  communities, founded in 2022 and operating across four continents. It moves money across
  60+ markets at the mid-market rate with settlement in about ten seconds, issues US dollar
  Visa cards accepted in 170+ countries, opens multi-currency accounts in the customer''s own
  name, pays yield on US dollar savings held through partner US chartered institutions, and
  reports rent and repayment history to the major US credit bureaus so customers build a US
  credit file. Kredete for Business adds multi-currency operating accounts, corporate cards,
  FedWire routing, payroll, and invoicing. An in-app agent runs these actions on the customer''s
  behalf with confirmation. Kredete is a financial technology company, not a bank; remittance and
  banking services are provided by partner US licensed financial institutions. Backed by Partech
  and Techstars. As of this enrichment pass Kredete publishes no public developer API, developer
  portal, SDK, or machine-readable API description.'
